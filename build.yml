name: Build APK

# 触发：推送到 main/master 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 用 Gradle 8.4 编译 Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.4"
          arguments: assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ledger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
