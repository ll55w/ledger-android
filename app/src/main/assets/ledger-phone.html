<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8a24a">
<title>打工人小账本</title>
<style>
  :root{
    --bg:#f7f1e6;
    --bg2:#f1e8d6;
    --card:#fffdf8;
    --gold:#c8a24a;
    --gold-deep:#a8842f;
    --gold-light:#f0e2bf;
    --text:#4a4133;
    --muted:#9b8f78;
    --line:rgba(200,162,74,.28);
    --expense:#c0392b;
    --income:#2e8b6f;
    --shadow:0 6px 22px rgba(120,95,40,.12);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);background:var(--bg);font-size:16px;line-height:1.5;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .serif{font-family:Georgia,"Times New Roman","Songti SC",serif}
  svg{display:block}
  .icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-fill{width:22px;height:22px;fill:currentColor;stroke:none}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;
    background:linear-gradient(135deg,#fffdf8,#f6ecd6);
    border-bottom:1px solid var(--line);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .piggy{width:54px;height:46px;flex:none}
  .topbar .ttl{font-size:20px;font-weight:700;letter-spacing:.5px}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}

  .layout{display:flex;min-height:calc(100vh - 130px)}
  /* Sidebar */
  .sidebar{
    width:200px;flex:none;background:var(--bg2);
    border-right:1px solid var(--line);
    padding:18px 12px;display:flex;flex-direction:column;gap:6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:14px;cursor:pointer;
    color:var(--text);font-size:15px;font-weight:600;
    border:1px solid transparent;transition:.15s;
  }
  .nav-item .icon{color:var(--gold-deep)}
  .nav-item:hover{background:#fff}
  .nav-item.active{
    background:#fff;border-color:var(--line);
    box-shadow:var(--shadow);color:var(--gold-deep);
  }
  .nav-item.active .icon{color:var(--gold-deep)}

  .content{flex:1;padding:18px;max-width:920px;margin:0 auto;width:100%}
  .view{display:none;animation:fade .2s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card-title{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card-title .icon{color:var(--gold-deep)}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:44px;padding:10px 16px;border-radius:13px;
    border:1px solid var(--line);background:#fff;color:var(--text);
    font-size:15px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .btn:active{transform:scale(.97)}
  .btn .icon{width:18px;height:18px}
  .btn-gold{background:linear-gradient(135deg,#e9c873,#c8a24a);color:#fff;border-color:var(--gold-deep)}
  .btn-gold .icon{color:#fff}
  .btn-ghost{background:transparent}
  .btn-danger{background:#fff;color:var(--expense);border-color:rgba(192,57,43,.35)}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}

  /* Stat grid */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:20px;font-weight:700;margin-top:4px}
  .v.exp{color:var(--expense)} .v.inc{color:var(--income)}

  /* Handle list */
  .handle-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;background:#fff8ef;border:1px solid var(--line);margin-bottom:10px}
  .handle-item.warn{background:#fdecea;border-color:rgba(192,57,43,.3)}
  .handle-item .hi-ic{width:34px;height:34px;border-radius:10px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;color:var(--gold-deep);flex:none}
  .handle-item.warn .hi-ic{background:#f6c9c4;color:var(--expense)}
  .handle-item .hi-tx{flex:1;font-size:14px}
  .handle-item .hi-tx b{display:block;font-size:14px}
  .handle-item .hi-tx small{color:var(--muted)}

  .banner{background:linear-gradient(135deg,#fff4d6,#f6e3b8);border:1px solid var(--gold);color:var(--gold-deep);padding:12px 14px;border-radius:13px;font-size:13px;margin-bottom:16px;display:flex;gap:8px;align-items:center}

  /* Form */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{
    width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--line);
    border-radius:12px;background:#fff;color:var(--text);font-size:16px;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;min-height:60px}
  .amount-input{font-size:30px;font-weight:700;text-align:right;letter-spacing:.5px}

  .toggle{display:flex;background:#fff;border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
  .toggle button{flex:1;min-height:42px;border:none;background:transparent;border-radius:10px;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}
  .toggle button.on{background:var(--gold-light);color:var(--gold-deep)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 13px;border-radius:30px;border:1px solid var(--line);
    background:#fff;color:var(--text);font-size:14px;cursor:pointer;min-height:42px;
  }
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip.on{background:#fff;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-light)}
  .chip .icon{width:18px;height:18px}

  .quick-amt{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .quick-amt button{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;min-height:42px}

  /* Records list */
  .rec{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:none}
  .rec .ric{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .rec .rmid{flex:1;min-width:0}
  .rec .rmid .rn{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .rmid .rc{font-size:12px;color:var(--muted)}
  .rec .ramt{font-weight:700;font-size:16px;white-space:nowrap}
  .rec .ramt.exp{color:var(--expense)} .rec .ramt.inc{color:var(--income)}
  .rec .rdel{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .rec .rdel .icon{width:18px;height:18px}
  .demo-tag{font-size:10px;background:var(--gold-light);color:var(--gold-deep);padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .filter-bar > *{flex:1;min-width:130px}

  /* Month calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head .m{font-size:18px;font-weight:700}
  .cal-nav{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-wd{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}
  .cal-cell{
    aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;position:relative;padding:2px;overflow:hidden;
  }
  .cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-light)}
  .cal-cell.empty{background:transparent;border:none;cursor:default}
  .cal-cell .dn{font-size:13px;font-weight:600}
  .cal-cell .da{font-size:10px;line-height:1.1;margin-top:1px}
  .da.exp{color:var(--expense)} .da.inc{color:var(--income)}
  .cal-cell.has{background:#fffaf0}

  /* Funds */
  .fund{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
  .fund:last-child{border-bottom:none}
  .fund .fric{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e9c873,#c8a24a);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .fund .fmid{flex:1;min-width:0}
  .fund .fname{font-weight:700;font-size:15px}
  .fund .fmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .fund .fval{text-align:right}
  .fund .fval .fa{font-weight:700;color:var(--expense)}
  .fund .fval .fm{font-size:11px;color:var(--muted);margin-top:2px}
  .fund .fval .fg{color:var(--income);font-weight:700}

  /* Bottom tabs (mobile) */
  .bottomtabs{display:none}
  .fab{display:none}

  /* Sheet */
  .sheet-mask{position:fixed;inset:0;background:rgba(40,33,20,.45);display:none;z-index:60}
  .sheet-mask.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:20px;transform:translateY(100%);transition:.25s;max-height:78vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sheet-mask.show .sheet{transform:translateY(0)}
  .sheet .sh-title{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .sheet .sh-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

  /* Responsive */
  @media(max-width:768px){
    .sidebar{display:none}
    .content{padding:14px}
    .bottomtabs{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
      background:linear-gradient(135deg,#fffdf8,#f6ecd6);
      border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around;
    }
    .bt-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;cursor:pointer}
    .bt-item .icon{width:22px;height:22px}
    .bt-item.active{color:var(--gold-deep)}
    .fab{
      display:flex;position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));
      width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e9c873,#c8a24a);
      color:#fff;align-items:center;justify-content:center;z-index:45;box-shadow:0 8px 22px rgba(168,132,47,.45);cursor:pointer;
    }
    .fab .icon{width:28px;height:28px;color:#fff}
  }
  @media(min-width:769px){.fab{display:none}}
</style>
</head>
<body>

<header class="topbar">
  <svg class="piggy" viewBox="0 0 120 100" aria-label="小猪存钱罐">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d98a"/><stop offset="1" stop-color="#c8a24a"/>
    </linearGradient></defs>
    <ellipse cx="58" cy="58" rx="42" ry="32" fill="url(#pg)" stroke="#a8842f" stroke-width="2"/>
    <path d="M30 32 q-7 -15 6 -11 q7 3 2 13 z" fill="url(#pg)" stroke="#a8842f" stroke-width="2"/>
    <ellipse cx="22" cy="60" rx="10" ry="12" fill="#e9c873" stroke="#a8842f" stroke-width="2"/>
    <circle cx="19" cy="58" r="1.6" fill="#a8842f"/><circle cx="25" cy="58" r="1.6" fill="#a8842f"/>
    <circle cx="44" cy="48" r="2.4" fill="#6b531f"/>
    <rect x="40" y="86" width="8" height="10" rx="3" fill="#c8a24a" stroke="#a8842f" stroke-width="2"/>
    <rect x="68" y="86" width="8" height="10" rx="3" fill="#c8a24a" stroke="#a8842f" stroke-width="2"/>
    <path d="M70 30 q12 -2 18 2" stroke="#a8842f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="86" cy="22" r="7" fill="#f3d98a" stroke="#a8842f" stroke-width="2"/>
    <text x="86" y="26" font-size="9" text-anchor="middle" fill="#a8842f" font-weight="bold">¥</text>
    <path d="M100 58 q10 -4 6 8" stroke="#a8842f" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
  <div>
    <div class="ttl serif">打工人小账本</div>
    <div class="sub">离线 · 本地存储 · 金色手账风</div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-item active" data-view="overview"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>今日速览</div>
    <div class="nav-item" data-view="add"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>秒记账</div>
    <div class="nav-item" data-view="records"><svg class="icon" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>记录</div>
    <div class="nav-item" data-view="month"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></svg>月度</div>
    <div class="nav-item" data-view="funds"><svg class="icon" viewBox="0 0 24 24"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>基金</div>
  </aside>

  <main class="content">
    <!-- Overview -->
    <section class="view active" id="view-overview">
      <div id="bannerWrap"></div>
      <div class="card">
        <div class="card-title"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>今天要处理</div>
        <div id="handleList"></div>
      </div>
      <div class="stats" id="overviewStats"></div>
      <div class="card">
        <div class="card-title"><svg class="icon" viewBox="0 0 24 24"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>本月分类支出</div>
        <div id="catBreakdown"></div>
      </div>
      <div class="card">
        <div class="card-title"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4v10M8 11l4 4 4-4M5 19h14"/></svg>数据管理</div>
        <div class="btn-row">
          <button class="btn btn-gold" onclick="exportJSON()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4v10M8 11l4 4 4-4M5 19h14"/></svg>导出 JSON</button>
          <button class="btn" onclick="document.getElementById('fileInput').click()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20V10M8 13l4-4 4 4M5 5h14"/></svg>导入恢复</button>
          <button class="btn" onclick="exportCSV()"><svg class="icon" viewBox="0 0 24 24"><path d="M5 19V8M12 19V5M19 19v-6"/></svg>导出 CSV</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-danger" onclick="clearDemo()"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>清空示例数据</button>
          <button class="btn btn-danger" onclick="clearAll()"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>清空全部</button>
        </div>
        <div class="note">手机本地版：数据全部存在你手机上，不上传任何服务器。<b>手动记账</b>存于本浏览器本地；<b>Tasker 自动抓取的付款</b>存于同目录的 <code>ledger_data.js</code> 文件，两者在此页合并显示。换手机/清缓存前请先「导出 JSON」备份。</div>
      </div>
    </section>

    <!-- Add -->
    <section class="view" id="view-add">
      <div class="card">
        <div class="card-title"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>秒记账</div>
        <div class="field">
          <div class="toggle" id="typeToggle">
            <button type="button" class="on" data-type="expense">支出</button>
            <button type="button" data-type="income">收入</button>
          </div>
        </div>
        <div class="field">
          <label>金额（¥）</label>
          <input id="amount" class="amount-input" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01">
          <div class="quick-amt" id="quickAmt">
            <button type="button" data-v="10">10</button>
            <button type="button" data-v="20">20</button>
            <button type="button" data-v="50">50</button>
            <button type="button" data-v="100">100</button>
            <button type="button" data-v="200">200</button>
          </div>
        </div>
        <div class="field">
          <label>分类</label>
          <div class="chips" id="catChips"></div>
        </div>
        <div class="field">
          <label>备注</label>
          <input id="note" type="text" placeholder="例如：午饭 / 地铁 / 工资">
        </div>
        <div class="field">
          <label>日期</label>
          <input id="recDate" type="date">
        </div>
        <button class="btn btn-gold" style="width:100%" onclick="saveRecord()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>记一笔</button>
      </div>
    </section>

    <!-- Records -->
    <section class="view" id="view-records">
      <div class="card">
        <div class="card-title"><svg class="icon" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>记录</div>
        <div class="filter-bar">
          <input id="filterMonth" type="month">
          <select id="filterCat"></select>
        </div>
        <div id="recList"></div>
        <div id="recSummary" class="note"></div>
      </div>
    </section>

    <!-- Month -->
    <section class="view" id="view-month">
      <div class="card">
        <div class="cal-head">
          <div class="cal-nav" onclick="shiftMonth(-1)"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div>
          <div class="m serif" id="calTitle"></div>
          <div class="cal-nav" onclick="shiftMonth(1)"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="stats" id="monthStats"></div>
    </section>

    <!-- Funds -->
    <section class="view" id="view-funds">
      <div class="card">
        <div class="card-title"><svg class="icon" viewBox="0 0 24 24"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>添加基金</div>
        <div class="field"><label>基金名称</label><input id="fName" type="text" placeholder="例如：沪深300ETF联接"></div>
        <div class="field"><label>买入日期</label><input id="fDate" type="date"></div>
        <div class="field"><label>投入金额（¥）</label><input id="fAmount" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01"></div>
        <div class="field"><label>份额（份）</label><input id="fShares" type="number" inputmode="decimal" placeholder="0" min="0" step="0.0001"></div>
        <div class="field"><label>当前净值（可选，用于算市值）</label><input id="fNet" type="number" inputmode="decimal" placeholder="留空则不计算市值" min="0" step="0.0001"></div>
        <div class="field"><label>备注</label><input id="fNote" type="text" placeholder="例如：每月定投"></div>
        <button class="btn btn-gold" style="width:100%" onclick="saveFund()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加基金</button>
      </div>
      <div class="card">

<!-- Tasker 把自动抓取的付款记录写进同目录的 ledger_data.js（设置 window.LD）-->
<script src="ledger_data.js"></script>

<script>
/* ---------- Icons ---------- */
const ICONS = {
  fork:'<path d="M8 3v6M8 9c0 1.5-1 2-1 4a2 2 0 004 0c0-2-1-2.5-1-4M16 3v6M16 9c0 1.5-1 2-1 4a2 2 0 004 0c0-2-1-2.5-1-4M6 21h12"/>',
  bus:'<rect x="4" y="4" width="16" height="14" rx="2"/><path d="M4 11h16M8 18v2M16 18v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>',
  bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/>',
  home:'<path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/>',
  star:'<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>',
  heart:'<path d="M12 20s-7-4.5-7-9a4 4 0 017-2 4 4 0 017 2c0 4.5-7 9-7 9z"/><path d="M12 8v5M9.5 10.5h5"/>',
  book:'<path d="M5 4h11a2 2 0 012 2v14H7a2 2 0 01-2-2z"/><path d="M5 4v14"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1.5"/>',
  coins:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',
  dots:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>',
  chart:'<path d="M5 19V10M12 19V5M19 19v-6"/>'
};
function svg(name,cls){return '<svg class="'+(cls||'icon')+'" viewBox="0 0 24 24">'+ICONS[name]+'</svg>';}

/* ---------- Categories ---------- */
const CATS = {
  '餐饮':{icon:'fork',color:'#e08a3c'},
  '交通':{icon:'bus',color:'#4a90c2'},
  '购物':{icon:'bag',color:'#c264a0'},
  '居住':{icon:'home',color:'#7a9a5b'},
  '娱乐':{icon:'star',color:'#d4b13f'},
  '医疗':{icon:'heart',color:'#d9645a'},
  '教育':{icon:'book',color:'#5b8fb0'},
  '工资':{icon:'wallet',color:'#3f9d6b'},
  '投资':{icon:'coins',color:'#b8923a'},
  '其他':{icon:'dots',color:'#9b8f78'}
};
const EXPENSE_CATS = ['餐饮','交通','购物','居住','娱乐','医疗','教育','其他'];
const INCOME_CATS  = ['工资','投资','其他'];

/* ---------- Storage（手机本地版：浏览器本地 + Tasker 抓取文件 合并）---------- */
const KEY_R='wb_zhangben_records', KEY_F='wb_zhangben_funds', KEY_S='wb_zhangben_settings', KEY_HR='wb_zhangben_hidden_r', KEY_HF='wb_zhangben_hidden_f';
let records=[], funds=[], settings={};
let localRecords=[], localFunds=[];
let taskerRecords=[], taskerFunds=[];
let hiddenR=new Set(), hiddenF=new Set();
let curType='expense', curCat='餐饮';
let curYear, curMonth;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function todayStr(){return fmtDate(new Date());}
function recompute(){
  records = localRecords.concat(taskerRecords.filter(r=>!hiddenR.has(r.id)));
  funds   = localFunds.concat(taskerFunds.filter(f=>!hiddenF.has(f.id)));
}
function save(){
  localStorage.setItem(KEY_R,JSON.stringify(localRecords));
  localStorage.setItem(KEY_F,JSON.stringify(localFunds));
  localStorage.setItem(KEY_S,JSON.stringify(settings));
  localStorage.setItem(KEY_HR,JSON.stringify([...hiddenR]));
  localStorage.setItem(KEY_HF,JSON.stringify([...hiddenF]));
}
function load(){
  try{localRecords=JSON.parse(localStorage.getItem(KEY_R)||'[]');}catch(e){localRecords=[];}
  try{localFunds=JSON.parse(localStorage.getItem(KEY_F)||'[]');}catch(e){localFunds=[];}
  try{settings=JSON.parse(localStorage.getItem(KEY_S)||'{}');}catch(e){settings={};}
  try{hiddenR=new Set(JSON.parse(localStorage.getItem(KEY_HR)||'[]'));}catch(e){hiddenR=new Set();}
  try{hiddenF=new Set(JSON.parse(localStorage.getItem(KEY_HF)||'[]'));}catch(e){hiddenF=new Set();}
  // Tasker 写入的同目录文件（window.LD）
  try{
    const LD = (typeof window.LD!=='undefined' && window.LD) ? window.LD : null;
    taskerRecords = (LD && Array.isArray(LD.records)) ? LD.records : [];
    taskerFunds  = (LD && Array.isArray(LD.funds)) ? LD.funds : [];
  }catch(e){ taskerRecords=[]; taskerFunds=[]; }
  if(localRecords.length===0 && localFunds.length===0 && !localStorage.getItem(KEY_R)){ seed(); }
  recompute();
}
function seed(){
  const t=new Date();
  const d=(o)=>{const x=new Date(t);x.setDate(x.getDate()+o);return fmtDate(x);};
  localRecords=[
    mk(d(0),'expense',38,'餐饮','午饭·黄焖鸡米饭',true),
    mk(d(-1),'expense',12.5,'交通','地铁通勤',true),
    mk(d(-2),'expense',199,'购物','夏季T恤x2',true),
    mk(d(-3),'income',5000,'工资','月度工资到账（示例）',true),
    mk(d(-5),'expense',68,'餐饮','周末聚餐AA',true),
    mk(d(-8),'expense',45,'娱乐','电影票',true),
    mk(d(-15),'expense',320,'居住','房租水电（示例）',true)
  ];
  localFunds=[
    {id:uid(),name:'沪深300ETF联接',buyDate:d(-30),amount:1000,shares:1000,net:1.08,note:'每月定投',isDemo:true},
    {id:uid(),name:'某稳健混合基金',buyDate:d(-65),amount:2000,shares:760,net:2.45,note:'一次性买入',isDemo:true}
  ];
  save();recompute();
}
function mk(date,type,amount,category,note,isDemo){return {id:uid(),date:date,type:type,amount:amount,category:category,note:note,ts:Date.now()+(isDemo?0:0),isDemo:!!isDemo};}

/* ---------- Navigation ---------- */
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.view===v));
  document.querySelectorAll('.bt-item').forEach(el=>el.classList.toggle('active',el.dataset.view===v));
  window.scrollTo(0,0);
  if(v==='overview')renderOverview();
  if(v==='records')renderRecords();
  if(v==='month')renderMonth();
  if(v==='funds')renderFunds();
  if(v==='add')renderCats();
}
document.querySelectorAll('.nav-item,.bt-item').forEach(el=>el.addEventListener('click',()=>showView(el.dataset.view)));

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- Overview ---------- */
function monthRecords(y,m){return records.filter(r=>{const p=r.date.split('-');return +p[0]===y && +p[1]===m;});}
function renderOverview(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1;
  const mr=monthRecords(y,m);
  let exp=0,inc=0;mr.forEach(r=>{if(r.type==='expense')exp+=r.amount;else inc+=r.amount;});
  const bal=inc-exp;
  // banner
  const bw=document.getElementById('bannerWrap');
  if(records.length>=30){bw.innerHTML='<div class="banner"><svg class="icon" viewBox="0 0 24 24" style="color:var(--gold-deep)"><path d="M12 4v10M8 11l4 4 4-4M5 19h14"/></svg>数据已积累 '+records.length+' 条，建议导出 JSON 备份。</div>';}
  else bw.innerHTML='';
  // handle list
  const hl=document.getElementById('handleList');
  let items='';
  const demoN=records.filter(r=>r.isDemo).length+funds.filter(f=>f.isDemo).length;
  if(demoN>0){
    items+='<div class="handle-item warn"><div class="hi-ic"><svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div><div class="hi-tx"><b>示例数据待清理（'+demoN+' 条）</b><small>页面默认演示数据，建议清空后开始真实记账</small></div><button class="btn btn-danger" onclick="clearDemo()">清空示例</button></div>';
  }
  if(settings.budget && exp>settings.budget){
    items+='<div class="handle-item warn"><div class="hi-ic"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div><div class="hi-tx"><b>本月支出已超预算</b><small>预算 ¥'+settings.budget+'，已超 ¥'+(exp-settings.budget).toFixed(2)+'</small></div></div>';
  }
  const todayR=records.filter(r=>r.date===todayStr());
  if(todayR.length){
    let te=0,ti=0;todayR.forEach(r=>{if(r.type==='expense')te+=r.amount;else ti+=r.amount;});
    items+='<div class="handle-item"><div class="hi-ic"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div><div class="hi-tx"><b>今日已记录 '+todayR.length+' 笔</b><small>支出 ¥'+te.toFixed(2)+(ti>0?' · 收入 ¥'+ti.toFixed(2):'')+'</small></div><button class="btn btn-gold" onclick="showView(\'records\')">查看</button></div>';
  }
  if(!items)items='<div class="note" style="margin:0">今天没有待处理事项，继续保持～</div>';
  hl.innerHTML=items;
  // stats
  let totalFund=0,fundMarket=0;funds.forEach(f=>{totalFund+=f.amount||0;if(f.net&&f.shares)fundMarket+=f.net*f.shares;});
  document.getElementById('overviewStats').innerHTML=
    stat('本月支出','¥'+exp.toFixed(2),'exp')+
    stat('本月收入','¥'+inc.toFixed(2),'inc')+
    stat('本月结余','¥'+bal.toFixed(2),bal>=0?'inc':'exp')+
    stat('基金总投入','¥'+totalFund.toFixed(2),'');
  // category breakdown
  const cb=document.getElementById('catBreakdown');
  const map={};mr.filter(r=>r.type==='expense').forEach(r=>{map[r.category]=(map[r.category]||0)+r.amount;});
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!arr.length){cb.innerHTML='<div class="note" style="margin:0">本月暂无支出记录。</div>';}
  else{
    const max=arr[0][1];
    cb.innerHTML=arr.map(([c,v])=>{
      const pct=Math.max(6,Math.round(v/max*100));
      const col=CATS[c]?CATS[c].color:'#c8a24a';
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="width:54px;font-size:13px">'+c+'</div><div style="flex:1;height:14px;background:#f3ecdc;border-radius:8px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+col+';border-radius:8px"></div></div><div style="width:78px;text-align:right;font-size:13px;font-weight:600;color:var(--expense)">¥'+v.toFixed(2)+'</div></div>';
    }).join('');
  }
}
function stat(k,v,cls){return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>';}

/* ---------- Add ---------- */
function renderCats(){
  const list=curType==='expense'?EXPENSE_CATS:INCOME_CATS;
  if(!list.includes(curCat))curCat=list[0];
  const box=document.getElementById('catChips');
  box.innerHTML=list.map(c=>{
    const col=CATS[c].color;
    return '<div class="chip'+(c===curCat?' on':'')+'" data-cat="'+c+'" onclick="pickCat(\''+c+'\')">'+svg(CATS[c].icon)+'<span class="dot" style="background:'+col+'"></span>'+c+'</div>';
  }).join('');
}
function pickCat(c){curCat=c;renderCats();}
document.getElementById('typeToggle').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  curType=b.dataset.type;
  document.querySelectorAll('#typeToggle button').forEach(x=>x.classList.toggle('on',x===b));
  renderCats();
});
document.getElementById('quickAmt').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const inp=document.getElementById('amount');
  inp.value=(parseFloat(inp.value||'0')+parseFloat(b.dataset.v)).toString();
});
function saveRecord(){
  const amt=parseFloat(document.getElementById('amount').value);
  if(!(amt>0)){toast('请输入有效金额');return;}
  const rec={id:uid(),date:document.getElementById('recDate').value||todayStr(),type:curType,category:curCat,note:document.getElementById('note').value.trim()||'(无备注)',amount:amt,ts:Date.now(),isDemo:false};
  localRecords.push(rec);recompute();save();
  document.getElementById('amount').value='';document.getElementById('note').value='';
  toast('已记一笔 · '+rec.category+' ¥'+amt.toFixed(2));
  renderOverview();
}

/* ---------- Records ---------- */
function renderRecords(){
  const fm=document.getElementById('filterMonth').value;
  const fc=document.getElementById('filterCat').value;
  let list=records.slice().sort((a,b)=> b.ts-a.ts);
  if(fm)list=list.filter(r=>r.date.startsWith(fm));
  if(fc&&fc!=='全部')list=list.filter(r=>r.category===fc);
  const box=document.getElementById('recList');
  if(!list.length){box.innerHTML='<div class="note" style="margin:0">没有符合条件的记录。</div>';document.getElementById('recSummary').textContent='';return;}
  box.innerHTML=list.map(r=>{
    const col=CATS[r.category]?CATS[r.category].color:'#c8a24a';
    const sign=r.type==='expense'?'-':'+';
    const cls=r.type==='expense'?'exp':'inc';
    return '<div class="rec"><div class="ric" style="background:'+col+'">'+svg(CATS[r.category]?CATS[r.category].icon:'dots')+'</div>'+
      '<div class="rmid"><div class="rn">'+escapeHtml(r.note)+(r.isDemo?'<span class="demo-tag">示例</span>':'')+'</div>'+
      '<div class="rc">'+r.date+' · '+r.category+'</div></div>'+
      '<div class="ramt '+cls+'">'+sign+'¥'+r.amount.toFixed(2)+'</div>'+
      '<div class="rdel" onclick="delRecord(\''+r.id+'\')"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></div></div>';
  }).join('');
  let e=0,i=0;list.forEach(r=>{if(r.type==='expense')e+=r.amount;else i+=r.amount;});
  document.getElementById('recSummary').textContent='共 '+list.length+' 笔 · 支出 ¥'+e.toFixed(2)+' · 收入 ¥'+i.toFixed(2);
}
function delRecord(id){
  if(!confirm('确定删除这条记录？'))return;
  if(localRecords.some(r=>r.id===id)) localRecords=localRecords.filter(r=>r.id!==id);
  else hiddenR.add(id);
  recompute();save();renderRecords();renderOverview();toast('已删除');
}
function initFilters(){
  const sel=document.getElementById('filterCat');
  sel.innerHTML='<option value="全部">全部分类</option>'+Object.keys(CATS).map(c=>'<option value="'+c+'">'+c+'</option>').join('');
  const now=new Date();document.getElementById('filterMonth').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  sel.addEventListener('change',renderRecords);
  document.getElementById('filterMonth').addEventListener('change',renderRecords);
}

/* ---------- Month ---------- */
function shiftMonth(d){curMonth+=d;if(curMonth<1){curMonth=12;curYear--;}if(curMonth>12){curMonth=1;curYear++;}renderMonth();}
function renderMonth(){
  if(curYear===undefined){const n=new Date();curYear=n.getFullYear();curMonth=n.getMonth()+1;}
  document.getElementById('calTitle').textContent=curYear+'年'+curMonth+'月';
  const first=new Date(curYear,curMonth-1,1);
  const startWd=first.getDay();
  const days=new Date(curYear,curMonth,0).getDate();
  const totals={};
  records.forEach(r=>{const p=r.date.split('-');if(+p[0]===curYear&&+p[1]===curMonth){if(!totals[r.date])totals[r.date]={e:0,i:0};if(r.type==='expense')totals[r.date].e+=r.amount;else totals[r.date].i+=r.amount;}});
  const today=todayStr();
  let html='';
  ['日','一','二','三','四','五','六'].forEach(w=>html+='<div class="cal-wd">'+w+'</div>');
  for(let i=0;i<startWd;i++)html+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=curYear+'-'+String(curMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const t=totals[ds];
    let inner='<div class="dn">'+d+'</div>';
    let cls='cal-cell';if(ds===today)cls+=' today';if(t)cls+=' has';
    if(t){if(t.e>0)inner+='<div class="da exp">¥'+t.e.toFixed(0)+'</div>';if(t.i>0)inner+='<div class="da inc">+'+t.i.toFixed(0)+'</div>';}
    html+='<div class="'+cls+'" onclick="openDay(\''+ds+'\')">'+inner+'</div>';
  }
  document.getElementById('calGrid').innerHTML=html;
  const mr=monthRecords(curYear,curMonth);
  let e=0,i=0;mr.forEach(r=>{if(r.type==='expense')e+=r.amount;else i+=r.amount;});
  document.getElementById('monthStats').innerHTML=stat('本月支出','¥'+e.toFixed(2),'exp')+stat('本月收入','¥'+i.toFixed(2),'inc')+stat('本月结余','¥'+(i-e).toFixed(2),(i-e)>=0?'inc':'exp');
}
function openDay(ds){
  const list=records.filter(r=>r.date===ds).sort((a,b)=>b.ts-a.ts);
  document.getElementById('sheetTitle').textContent=ds+' 明细';
  const body=document.getElementById('sheetBody');
  if(!list.length){body.innerHTML='<div class="note" style="margin:0">这一天没有记录。</div>';}
  else{
    body.innerHTML=list.map(r=>{
      const col=CATS[r.category]?CATS[r.category].color:'#c8a24a';
      const sign=r.type==='expense'?'-':'+';const cls=r.type==='expense'?'exp':'inc';
      return '<div class="rec"><div class="ric" style="background:'+col+'">'+svg(CATS[r.category]?CATS[r.category].icon:'dots')+'</div>'+
        '<div class="rmid"><div class="rn">'+escapeHtml(r.note)+(r.isDemo?'<span class="demo-tag">示例</span>':'')+'</div><div class="rc">'+r.category+'</div></div>'+
        '<div class="ramt '+cls+'">'+sign+'¥'+r.amount.toFixed(2)+'</div>'+
        '<div class="rdel" onclick="delRecord(\''+r.id+'\');closeSheet();openDay(\''+ds+'\')"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></div></div>';
    }).join('');
  }
  document.getElementById('sheetMask').classList.add('show');
}
function closeSheet(){document.getElementById('sheetMask').classList.remove('show');}

/* ---------- Funds ---------- */
function renderFunds(){
  const box=document.getElementById('fundList');
  if(!funds.length){box.innerHTML='<div class="note" style="margin:0">还没有添加基金，先在上方添加一笔吧。</div>';document.getElementById('fundSummary').textContent='';return;}
  box.innerHTML=funds.slice().sort((a,b)=>b.buyDate.localeCompare(a.buyDate)).map(f=>{
    const market=(f.net&&f.shares)?f.net*f.shares:null;
    const gain=market!=null?(market-f.amount):null;
    const gainPct=gain!=null&&f.amount>0?(gain/f.amount*100):null;
    return '<div class="fund"><div class="fric">'+svg('coins')+'</div>'+
      '<div class="fmid"><div class="fname">'+escapeHtml(f.name)+(f.isDemo?'<span class="demo-tag">示例</span>':'')+'</div>'+
      '<div class="fmeta">买入 '+f.buyDate+(f.shares?' · 份额 '+f.shares+' 份':'')+(f.note?' · '+escapeHtml(f.note):'')+'</div></div>'+
      '<div class="fval"><div class="fa">投入 ¥'+(f.amount||0).toFixed(2)+'</div>'+
      (market!=null?'<div class="fg">市值 ¥'+market.toFixed(2)+'</div><div class="fm">'+(gain>=0?'+':'')+gain.toFixed(2)+' ('+(gainPct>=0?'+':'')+gainPct.toFixed(1)+'%)</div>':'<div class="fm">未填净值</div>')+
      '</div><div class="rdel" onclick="delFund(\''+f.id+'\')"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></div></div>';
  }).join('');
  let total=0,market=0;funds.forEach(f=>{total+=f.amount||0;if(f.net&&f.shares)market+=f.net*f.shares;});
  document.getElementById('fundSummary').textContent='基金总投入 ¥'+total.toFixed(2)+(market>0?' · 总市值 ¥'+market.toFixed(2):'');
}
function saveFund(){
  const name=document.getElementById('fName').value.trim();
  const amount=parseFloat(document.getElementById('fAmount').value);
  if(!name){toast('请填写基金名称');return;}
  if(!(amount>0)){toast('请填写有效投入金额');return;}
  localFunds.push({id:uid(),name:name,buyDate:document.getElementById('fDate').value||todayStr(),amount:amount,shares:parseFloat(document.getElementById('fShares').value)||0,net:parseFloat(document.getElementById('fNet').value)||0,note:document.getElementById('fNote').value.trim(),isDemo:false});
  recompute();save();
  ['fName','fAmount','fShares','fNet','fNote'].forEach(id=>document.getElementById(id).value='');
  toast('已添加基金 '+name);renderFunds();renderOverview();
}
function delFund(id){
  if(!confirm('确定删除这只基金？'))return;
  if(localFunds.some(f=>f.id===id)) localFunds=localFunds.filter(f=>f.id!==id);
  else hiddenF.add(id);
  recompute();save();renderFunds();renderOverview();toast('已删除');
}

/* ---------- Export / Import / Clear ---------- */
function download(filename,text,type){
  const blob=new Blob([text],{type:type||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function exportJSON(){
  const data={app:'打工人小账本',version:1,exportedAt:new Date().toISOString(),records:records,funds:funds,settings:settings};
  download('打工人小账本_'+todayStr()+'.json',JSON.stringify(data,null,2),'application/json');
  toast('已导出 JSON');
}
function exportCSV(){
  const rows=[['日期','类型','分类','备注','金额']];
  records.slice().sort((a,b)=>b.ts-a.ts).forEach(r=>rows.push([r.date,r.type==='expense'?'支出':'收入',r.category,r.note,r.amount]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('打工人小账本_'+todayStr()+'.csv',csv,'text/csv;charset=utf-8');
  toast('已导出 CSV');
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!confirm('导入将覆盖当前所有「本地」记账与基金数据（Tasker 抓取的数据不会被覆盖），确定继续？')){e.target.value='';return;}
      localRecords=data.records||[];localFunds=data.funds||[];settings=data.settings||{};
      hiddenR=new Set();hiddenF=new Set();
      recompute();save();showView('overview');toast('导入成功 · 本地 '+localRecords.length+' 条记录');
    }catch(err){alert('文件格式错误，导入失败');}
    e.target.value='';
  };
  rd.readAsText(f);
}
function clearDemo(){
  const n=records.filter(r=>r.isDemo).length+funds.filter(f=>f.isDemo).length;
  if(n===0){toast('当前没有示例数据');return;}
  if(confirm('确定清空全部示例数据？你自己的真实记录不受影响。')){
    localRecords=localRecords.filter(r=>!r.isDemo);
    localFunds=localFunds.filter(f=>!f.isDemo);
    taskerRecords.forEach(r=>{if(r.isDemo)hiddenR.add(r.id);});
    taskerFunds.forEach(f=>{if(f.isDemo)hiddenF.add(f.id);});
    recompute();save();showView('overview');toast('示例数据已清空');
  }
}
function clearAll(){
  if(confirm('⚠️ 将删除全部「本地」记账与基金数据（Tasker 抓取的数据需在其项目里清理），且无法恢复！确定继续？')){
    localRecords=[];localFunds=[];settings={};hiddenR=new Set();hiddenF=new Set();
    recompute();save();showView('overview');toast('本地数据已全部清空');
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Init ---------- */
function init(){
  load();
  document.getElementById('recDate').value=todayStr();
  document.getElementById('fDate').value=todayStr();
  initFilters();
  renderCats();
  renderOverview();
  renderRecords();
  renderMonth();
  renderFunds();
}
init();
</script>
